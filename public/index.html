<!DOCTYPE html>
<html lang="km" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WasmArcade</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Kantumruy Pro', 'sans-serif'], display: ['Chakra Petch', 'Kantumruy Pro', 'Inter', 'sans-serif'] },
          colors: {
            ink: {
              bg: '#0c0f15', panel: '#131823', raise: '#1a2130', line: '#232c3d',
              muted: '#8b95a7', accent: '#2dd4bf', warn: '#f5b544', danger: '#f2667a'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Single dark arcade look, chosen deliberately */
    :root { color-scheme: dark; }
    body { background: #0c0f15; color: #e2e8f0; }
    .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 2px; }
    html[lang="km"] body { line-height: 1.75; }
    html[lang="km"] .km-tight { line-height: 1.6; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0c0f15; }
    ::-webkit-scrollbar-thumb { background: #232c3d; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .icon-btn { width: 2.25rem; height: 2.25rem; display: inline-flex; align-items: center; justify-content: center;
      border-radius: .625rem; border: 1px solid #232c3d; background: #0c0f15; color: #cbd5e1; transition: .15s; }
    .icon-btn:hover { border-color: rgba(45,212,191,.5); color: #fff; }
    .chip { white-space: nowrap; padding: .375rem .875rem; border-radius: 999px; border: 1px solid #232c3d;
      font-size: .8125rem; color: #cbd5e1; background: #131823; transition: .15s; }
    .chip:hover { color: #fff; }
    .chip[aria-pressed="true"] { background: #2dd4bf; color: #0c0f15; border-color: #2dd4bf; font-weight: 600; }
    /* Covers: Steam header art is 460x215; the fallback is a designed title card. */
    .cover { position: relative; overflow: hidden; aspect-ratio: 460 / 215; max-width: 100%; background: #131823; }
    .cover { isolation: isolate; }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
    .cover.fit::before { content: ''; position: absolute; inset: -16px; z-index: 1;
      background: var(--img) center / cover; filter: blur(16px) brightness(.55); }
    .cover.fit img { object-fit: contain; }
    .cover-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: .15rem;
      padding: .75rem .9rem; color: #f8fafc;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
        radial-gradient(120% 90% at 85% 10%, hsl(var(--h) 85% 55% / .45), transparent 60%),
        linear-gradient(135deg, hsl(var(--h) 55% 20%), hsl(calc(var(--h) + 35) 60% 9%)); }
    .cover-fallback .ttl { font-family: 'Chakra Petch', 'Kantumruy Pro', sans-serif; font-weight: 700; text-transform: uppercase;
      letter-spacing: .03em; line-height: 1.05; font-size: clamp(1rem, 2.4vw, 1.35rem); text-wrap: balance; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .cover-fallback .eng { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: rgba(248,250,252,.7); }
    .cover.sm .ttl { font-size: .62rem; }
    .cover.sm .eng { display: none; }
    .cover.sm .cover-fallback { padding: .35rem .45rem; }
    .tab { position: relative; padding: .7rem 1rem; font-size: .95rem; font-weight: 600; color: #8b95a7; transition: color .15s; }
    .tab:hover { color: #fff; }
    .tab[aria-selected="true"] { color: #fff; }
    .tab[aria-selected="true"]::after { content: ''; position: absolute; left: .5rem; right: .5rem; bottom: -1px; height: 2px; border-radius: 2px; background: #2dd4bf; }
    .chev { transition: transform .2s; }
    [aria-expanded="true"] .chev { transform: rotate(180deg); }
    .seg button[aria-pressed="true"] { background: #2dd4bf; color: #0c0f15; }
    @media (prefers-reduced-motion: reduce) { .chev, .card { transition: none !important; } }
  </style>


  <!-- ============ HEADER ============ -->
  <header style="top: env(safe-area-inset-top, 0px)" class="sticky z-40 bg-ink-bg/90 backdrop-blur border-b border-ink-line">
    <div class="max-w-6xl mx-auto gutter h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-ink-accent/15 border border-ink-accent/40 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-gamepad text-ink-accent text-sm"></i>
        </div>
        <div class="min-w-0">
          <div class="font-bold text-white leading-tight">Wasm<span class="text-ink-accent">Arcade</span></div>
          <div class="text-xs text-ink-muted truncate hidden sm:block km-tight" data-i18n="tagline"></div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex rounded-lg border border-ink-line overflow-hidden text-xs" role="group" data-i18n-title="langLabel">
          <button id="lang-en" onclick="setLang('en')" class="px-2.5 py-1.5">EN</button>
          <button id="lang-km" onclick="setLang('km')" class="px-2.5 py-1.5">ខ្មែរ</button>
        </div>
        <button onclick="openModal('fileModal')" class="icon-btn" data-i18n-title="fileChecker">
          <i class="fa-solid fa-file-circle-check text-sm"></i>
        </button>
        <button onclick="openModal('storageModal')" class="icon-btn" data-i18n-title="storage">
          <i class="fa-solid fa-hard-drive text-sm"></i>
        </button>
        <button onclick="openModal('systemModal')" class="h-9 px-3 rounded-lg border border-ink-line bg-ink-panel hover:border-ink-accent/50 text-sm flex items-center gap-2 transition">
          <span id="sys-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span class="hidden sm:inline" data-i18n="system"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto gutter py-6 flex-1 flex flex-col gap-8">

    <!-- ============ LIBRARY ============ -->
    <section class="flex flex-col gap-4">
      <div role="tablist" class="flex gap-1 border-b border-ink-line" data-i18n-title="tabsLabel">
        <button id="tab-classic" role="tab" onclick="setTab('classic')" class="tab"><i class="fa-solid fa-gamepad mr-2 text-xs"></i><span data-i18n="tab_classic"></span></button>
        <button id="tab-web" role="tab" onclick="setTab('web')" class="tab"><i class="fa-solid fa-globe mr-2 text-xs"></i><span data-i18n="tab_web"></span></button>
      </div>
      <div class="flex items-end justify-between gap-3">
        <div><h2 class="text-lg font-bold text-white" data-i18n="library"></h2><p class="text-sm text-ink-muted km-tight"><span data-i18n="opensInTab"></span> <span data-i18n="coverCredit"></span></p></div>
        <span id="count" class="text-sm text-ink-muted"></span>
      </div>

      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-muted text-sm"></i>
          <input id="search" type="search" oninput="renderGrid()" data-i18n-ph="searchPh"
            class="w-full h-10 pl-10 pr-3 bg-ink-panel border border-ink-line focus:border-ink-accent rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none" />
        </div>
        <select id="status" onchange="statusFilter = this.value; renderGrid()"
          class="h-10 sm:w-56 bg-ink-panel border border-ink-line rounded-xl text-sm px-3 text-slate-200 focus:outline-none focus:border-ink-accent"></select>
        <div class="seg flex h-10 rounded-xl border border-ink-line overflow-hidden shrink-0 self-start sm:self-auto">
          <button id="view-grid" onclick="setView('grid')" class="w-11 text-slate-300 hover:text-white transition" data-i18n-title="viewGrid"><i class="fa-solid fa-table-cells-large"></i></button>
          <button id="view-list" onclick="setView('list')" class="w-11 text-slate-300 hover:text-white transition border-l border-ink-line" data-i18n-title="viewList"><i class="fa-solid fa-list"></i></button>
        </div>
      </div>

      <div id="cats" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>

      <div id="grid"></div>
    </section>
  </main>

  <footer class="border-t border-ink-line py-5 gutter text-xs text-ink-muted text-center km-tight">
    <span data-i18n="footer"></span>
  </footer>

  <!-- ============ MODAL: SYSTEM ============ -->
  <div id="systemModal" class="modal fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-ink-panel border border-ink-line rounded-2xl max-w-md w-full shadow-2xl">
      <div class="px-5 py-4 border-b border-ink-line flex items-center justify-between">
        <h3 class="font-semibold text-white" data-i18n="sysTitle"></h3>
        <button onclick="closeModal('systemModal')" class="text-ink-muted hover:text-white" data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 space-y-5 text-sm">
        <dl class="divide-y divide-ink-line">
          <div class="flex justify-between gap-4 py-2"><dt class="text-ink-muted">WebGPU</dt><dd id="sys-webgpu" class="text-right"></dd></div>
          <div class="flex justify-between gap-4 py-2"><dt class="text-ink-muted" data-i18n="sysGpu"></dt><dd id="sys-gpu" class="text-right truncate max-w-[60%]"></dd></div>
          <div class="flex justify-between gap-4 py-2"><dt class="text-ink-muted" data-i18n="sysThreads"></dt><dd id="sys-threads" class="text-right"></dd></div>
          <div class="flex justify-between gap-4 py-2"><dt class="text-ink-muted" data-i18n="sysPad"></dt><dd id="sys-pad" class="text-right truncate max-w-[60%]"></dd></div>
          <div class="flex justify-between gap-4 py-2"><dt class="text-ink-muted" data-i18n="sysStorage"></dt><dd id="sys-storage" class="text-right"></dd></div>
        </dl>
        <div>
          <h4 class="font-semibold text-white mb-2" data-i18n="tipsTitle"></h4>
          <ul class="space-y-2 text-slate-300 km-tight">
            <li class="flex gap-2"><i class="fa-solid fa-check text-ink-accent mt-1 text-xs"></i><span data-i18n="tip1"></span></li>
            <li class="flex gap-2"><i class="fa-solid fa-check text-ink-accent mt-1 text-xs"></i><span data-i18n="tip2"></span></li>
            <li class="flex gap-2"><i class="fa-solid fa-check text-ink-accent mt-1 text-xs"></i><span data-i18n="tip3"></span></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: FILE CHECKER ============ -->
  <div id="fileModal" class="modal fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-ink-panel border border-ink-line rounded-2xl max-w-lg w-full shadow-2xl">
      <div class="px-5 py-4 border-b border-ink-line flex items-center justify-between">
        <h3 class="font-semibold text-white" data-i18n="fileTitle"></h3>
        <button onclick="closeModal('fileModal')" class="text-ink-muted hover:text-white" data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 space-y-4 text-sm">
        <p class="text-slate-300 km-tight" data-i18n="fileDesc"></p>
        <label id="dropzone" class="border-2 border-dashed border-ink-line hover:border-ink-accent rounded-xl p-6 flex flex-col items-center gap-2 text-center cursor-pointer transition">
          <input type="file" class="hidden" onchange="handleFile(this.files[0]); this.value=''" />
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-ink-accent"></i>
          <span class="text-white" data-i18n="dropHere"></span>
        </label>
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span class="text-ink-muted" data-i18n="trySample"></span>
          <button onclick="sampleFile('DIABDAT.MPQ')" class="chip !text-xs">DIABDAT.MPQ</button>
          <button onclick="sampleFile('Halo.xiso')" class="chip !text-xs">Halo.xiso</button>
          <button onclick="sampleFile('valve.zip')" class="chip !text-xs">valve.zip</button>
        </div>
        <div id="file-result" class="hidden rounded-xl bg-ink-bg border border-ink-line p-4 space-y-2"></div>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: STORAGE ============ -->
  <div id="storageModal" class="modal fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-ink-panel border border-ink-line rounded-2xl max-w-md w-full shadow-2xl">
      <div class="px-5 py-4 border-b border-ink-line flex items-center justify-between">
        <h3 class="font-semibold text-white" data-i18n="storageTitle"></h3>
        <button onclick="closeModal('storageModal')" class="text-ink-muted hover:text-white" data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 space-y-4 text-sm">
        <div class="flex items-center justify-between gap-3">
          <div id="storage-used" class="text-white font-semibold"></div>
          <button onclick="clearHubData()" class="h-9 px-4 rounded-lg bg-ink-danger/15 hover:bg-ink-danger/25 text-ink-danger border border-ink-danger/40 transition">
            <i class="fa-solid fa-trash-can mr-1.5"></i><span data-i18n="clearData"></span>
          </button>
        </div>
        <div id="storage-feedback" class="hidden text-ink-accent" data-i18n="cleared"></div>
        <p class="text-slate-400 km-tight" data-i18n="storageNote"></p>
        <details class="text-xs">
          <summary class="cursor-pointer text-ink-muted hover:text-white" data-i18n="advancedMac"></summary>
          <div class="mt-2 flex items-center gap-2 bg-ink-bg border border-ink-line rounded-lg p-2.5 font-mono">
            <code id="mac-cmd" class="text-ink-accent break-all flex-1">du -sh ~/Library/Application\ Support/Google/Chrome/Default/IndexedDB/*</code>
            <button onclick="copyCmd()" class="shrink-0 px-2 py-1 rounded border border-ink-line hover:border-ink-accent/50 font-sans"><span id="copy-label" data-i18n="copy"></span></button>
          </div>
        </details>
      </div>
    </div>
  </div>

      { id: 36, title: 'A Dark Room', cat: 'web', tier: 'ready', engine: 'HTML5', ramMb: 60,

      { id: 37, title: 'Ouk Khmer', cat: 'web', tier: 'ready', engine: 'Web app', ramMb: 100, featured: true,
        mirrors: ['https://oukkhmer.web.app/'],
        en: 'Ouk, traditional Khmer chess, in your browser.', km: 'អុក ល្បែងអុកប្រពៃណីខ្មែរ លេងក្នុងកម្មវិធីរុករក។' }
    ];

    /* ===================== COVERS ===================== */
    // Each game tries its sources in order, in the visitor's browser: Steam store art,
    // then libretro box art, then the lead image of its Wikipedia article.
    // IDs, file names and article titles are from memory and unverified; a miss just
    // falls through to the next source and finally to the generated title card.
    const STEAM = { 1: 42700, 2: 42700, 3: 42700, 4: 202970, 5: 311210, 6: 10180, 7: 240, 8: 976730, 9: 976730,
      10: 70, 11: 10, 12: 2310, 13: 2320, 14: 2200, 15: 9010, 16: 13240, 17: 271590, 18: 12110,
      26: 2280, 27: 22320, 28: 9180 };
    const steamUrls = id => [
      `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg`,
      `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`
    ];
    // libretro-thumbnails names follow No-Intro/Redump titles, with & : and similar replaced by _.
    const lr = (system, name) =>
      `https://raw.githubusercontent.com/libretro-thumbnails/${system}/master/Named_Boxarts/${encodeURIComponent(name)}.png`;
    const BOXART = {
      19: [lr('Sony_-_PlayStation_2', 'Simpsons, The - Hit _ Run (USA)'), lr('Nintendo_-_GameCube', 'Simpsons, The - Hit _ Run (USA)')],
      20: [lr('Sony_-_PlayStation_3', 'Skate 3 (USA)')],
      22: [lr('Sony_-_PlayStation_Portable', 'Pro Evolution Soccer 6 (Europe)'),
           lr('Sony_-_PlayStation_Portable', 'Winning Eleven - Pro Evolution Soccer 2007 (USA)'),
           lr('Sony_-_PlayStation_2', 'Pro Evolution Soccer 6 (Europe)')],
      23: [lr('Sony_-_PlayStation', 'Diablo (USA)')]
    };
    const WIKI = {
      1: 'Call of Duty: Black Ops', 2: 'Call of Duty: Black Ops', 3: 'Call of Duty: Black Ops',
      4: 'Call of Duty: Black Ops II', 5: 'Call of Duty: Black Ops III', 6: 'Call of Duty: Modern Warfare 2',
      7: 'Counter-Strike: Source', 8: 'Halo: Combat Evolved', 9: 'Halo: Combat Evolved',
      10: 'Half-Life (video game)', 11: 'Counter-Strike (video game)', 12: 'Quake (video game)',
      13: 'Quake II', 14: 'Quake III Arena', 15: 'Return to Castle Wolfenstein', 16: 'Unreal Tournament',
      17: 'Grand Theft Auto V', 18: 'Grand Theft Auto: Vice City', 19: 'The Simpsons: Hit & Run',
      20: 'Skate 3', 22: 'Pro Evolution Soccer 6', 23: 'Diablo (video game)', 24: 'Hedgewars', 25: 'Minecraft',
      26: 'Doom (1993 video game)', 27: 'The Elder Scrolls III: Morrowind', 28: 'Commander Keen in Invasion of the Vorticons',
      29: 'Krunker', 30: 'Slither.io', 31: 'Agar.io', 32: 'Diep.io', 33: 'Lichess', 34: '2048 (video game)', 36: 'A Dark Room'
    };
    const HUE = { cod: 38, fps: 8, open: 305, sports: 150, other: 262, web: 195 };
    const COVER_KEY = 'wasmarcade_covers_v1';
    let coverOk = {};
    try { coverOk = JSON.parse(localStorage.getItem(COVER_KEY) || '{}'); } catch (e) { coverOk = {}; }
    const coverDead = new Set();
    const wikiCache = {};

    function coverSources(id) {
      return [...(STEAM[id] ? steamUrls(STEAM[id]) : []), ...(BOXART[id] || [])];
    }

    function wikiImage(id) {
      if (!WIKI[id]) return Promise.resolve(null);
      if (!wikiCache[id]) {
        const url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(WIKI[id].replace(/ /g, '_'));
        wikiCache[id] = fetch(url)
          .then(r => (r.ok ? r.json() : null))
          .then(j => {
            const src = j && j.thumbnail && j.thumbnail.source;
            return src ? src.replace(/\/\d+px-/, '/640px-') : null;
          })
          .catch(() => null);
      }
      return wikiCache[id];
    }

    function coverHtml(g, small = false) {
      let img = '';
      if (!coverDead.has(g.id)) {
        const first = coverOk[g.id] || coverSources(g.id)[0];
        const attrs = `alt="" loading="lazy" data-gid="${g.id}" data-i="${coverOk[g.id] ? -1 : 0}" onload="coverLoad(this)" onerror="coverError(this)"`;
        img = first ? `<img src="${first}" ${attrs}>` : `<img ${attrs} data-pending="1">`;
      }
      return `<div class="cover ${small ? 'sm rounded-lg' : ''}" style="--h:${HUE[g.cat]}">
          <div class="cover-fallback"><span class="ttl">${g.title}</span><span class="eng">${g.engine}</span></div>${img}
        </div>`;
    }

    // Images with no static source go straight to Wikipedia.
    function startPendingCovers() {
      document.querySelectorAll('.cover img[data-pending]').forEach(img => {
        img.removeAttribute('data-pending');
        coverError(img);
      });
    }

    function coverError(img) {
      const id = Number(img.dataset.gid);
      if (Number(img.dataset.i) === -1) {          // a remembered URL stopped working
        delete coverOk[id];
        try { localStorage.setItem(COVER_KEY, JSON.stringify(coverOk)); } catch (e) {}
      }
      const list = coverSources(id);
      const next = Number(img.dataset.i) + 1;
      if (next < list.length) { img.dataset.i = next; img.src = list[next]; return; }
      if (!img.dataset.wiki) {
        img.dataset.wiki = '1';
        wikiImage(id).then(src => { if (src) img.src = src; else giveUp(img, id); });
        return;
      }
      giveUp(img, id);
    }

    function giveUp(img, id) {
      coverDead.add(id);
      img.remove();
    }

    function coverLoad(img) {
      const id = Number(img.dataset.gid);
      const src = img.currentSrc || img.src;
      if (coverOk[id] !== src) {
        coverOk[id] = src;
        try { localStorage.setItem(COVER_KEY, JSON.stringify(coverOk)); } catch (e) {}
      }
      // Box art is portrait; show it whole over a blurred copy instead of cropping it.
      if (img.naturalHeight > img.naturalWidth * 0.8) {
        const cover = img.parentElement;
        cover.classList.add('fit');
        cover.style.setProperty('--img', `url("${src}")`);
      }
    }

    /* ===================== STATE ===================== */
    // v2: earlier builds saved English on every first load, so that old value is ignored.
    const LANG_KEY = 'wasmarcade_lang_v2';
    const FAV_KEY = 'wasmarcade_m1_favs';
    let lang = 'en';
    let statusFilter = 'all';
    let catFilter = 'all';
    const TAB_KEY = 'wasmarcade_tab';
    let tab = 'classic';
    try { tab = localStorage.getItem(TAB_KEY) === 'web' ? 'web' : 'classic'; } catch (e) {}
    if (location.hash === '#web') tab = 'web';
    if (location.hash === '#classic') tab = 'classic';
    const inTab = g => (tab === 'web') === (g.cat === 'web');
    let activeGame = null;
    let currentUrl = null;
    let adShield = false;
    let favorites = [];
    let lastFileResult = null;
    let view = 'grid';
    let expandedId = null;
    const VIEW_KEY = 'wasmarcade_view';
    try { view = localStorage.getItem(VIEW_KEY) === 'list' ? 'list' : 'grid'; } catch (e) {}
    const tel = { webgpu: null, gpu: null, threads: null, pad: null, storage: null };

    lang = 'km';  // Khmer by default; a saved choice wins
    try { lang = localStorage.getItem(LANG_KEY) || lang; } catch (e) {}
    try { favorites = JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { favorites = []; }

    function t(key, vars = {}) {
      const s = I18N[lang][key] ?? I18N.en[key] ?? key;
      return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    }
    function num(n) {
      const s = String(n);
      return lang === 'km' ? s.replace(/\d/g, d => '០១២៣៤៥៦៧៨៩'[d]) : s;
    }
    function host(url) { return url.replace(/^https?:\/\//, '').replace(/\/$/, ''); }
    function catName(id) { const c = CATEGORIES.find(c => c.id === id); return c ? c[lang] : id; }

    /* ===================== LANGUAGE ===================== */
    function setLang(l, remember = true) {
      lang = l;
      if (remember) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
      document.documentElement.lang = l;
      ['en', 'km'].forEach(code => {
        document.getElementById('lang-' + code).className =
          'px-2.5 py-1.5 transition ' + (code === l ? 'bg-ink-accent text-ink-bg font-semibold' : 'text-slate-300 hover:text-white');
      });
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.dataset.i18nTitle);
        el.setAttribute('aria-label', el.title);
      });
      renderStatusOptions();
      renderCategories();
      renderGrid();
      renderTelemetry();
      renderFileResult();
    }

    /* ===================== FILTERS & GRID ===================== */
    function renderStatusOptions() {
      const sel = document.getElementById('status');
      sel.innerHTML = STATUSES.map(s => {
        const pool = GAMES.filter(inTab);
        const n = s === 'all' ? pool.length : s === 'favorites' ? pool.filter(g => favorites.includes(g.id)).length : pool.filter(g => g.tier === s).length;
        return `<option value="${s}" ${s === statusFilter ? 'selected' : ''}>${t('st_' + s)} (${num(n)})</option>`;
      }).join('');
    }

    function renderCategories() {
      const wrap = document.getElementById('cats');
      wrap.hidden = tab === 'web';  // the Web apps tab is a single category
      const items = [{ id: 'all', label: t('cat_all') }, ...CATEGORIES.filter(c => c.id !== 'web').map(c => ({ id: c.id, label: c[lang] }))];
      wrap.innerHTML = items.map(c =>
        `<button class="chip" aria-pressed="${c.id === catFilter}" onclick="catFilter='${c.id}'; renderCategories(); renderGrid()">${c.label}</button>`
      ).join('');
    }

    function toggleFavorite(e, id) {
      e.stopPropagation();
      const i = favorites.indexOf(id);
      i > -1 ? favorites.splice(i, 1) : favorites.push(id);
      try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (err) {}
      renderStatusOptions();
      renderGrid();
    }

    const BADGE = {
      ready:    'bg-emerald-500/10 text-emerald-300 border-emerald-500/30',
      repaired: 'bg-sky-500/10 text-sky-300 border-sky-500/30',
      rom:      'bg-amber-500/10 text-amber-300 border-amber-500/30'
    };

    function renderGrid() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = GAMES.filter(g => {
        if (!inTab(g)) return false;
        if (statusFilter === 'favorites' && !favorites.includes(g.id)) return false;
        if (!['all', 'favorites'].includes(statusFilter) && g.tier !== statusFilter) return false;
        if (catFilter !== 'all' && g.cat !== catFilter) return false;
        if (q) return `${g.title} ${g.engine} ${g.en} ${g.km} ${catName(g.cat)} ${g.mirrors.join(' ')}`.toLowerCase().includes(q);
        return true;
      });

      list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
      document.getElementById('count').textContent = t('showing', { n: num(list.length), total: num(GAMES.filter(inTab).length) });
      const grid = document.getElementById('grid');

      if (!list.length) {
        grid.innerHTML = `
          <div class="col-span-full rounded-2xl border border-ink-line bg-ink-panel p-10 text-center">
            <i class="fa-solid fa-magnifying-glass text-2xl text-slate-600 mb-3"></i>
            <div class="text-white font-semibold">${t('emptyTitle')}</div>
            <div class="text-sm text-ink-muted mt-1">${t('emptyBody')}</div>
          </div>`;
        return;
      }

      if (view === 'list') {
        grid.className = 'flex flex-col rounded-2xl border border-ink-line bg-ink-panel divide-y divide-ink-line overflow-hidden';
        grid.innerHTML = list.map(listRow).join('');
      } else {
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';
        grid.innerHTML = list.map(gridCard).join('');
      }
      startPendingCovers();
    }

    function favButton(g, extra = '') {
      const fav = favorites.includes(g.id);
      return `<button onclick="toggleFavorite(event, ${g.id})" class="${extra} w-8 h-8 rounded-lg flex items-center justify-center transition" title="${t('fav')}" aria-label="${t('fav')}" aria-pressed="${fav}">
          <i class="${fav ? 'fa-solid text-rose-400' : 'fa-regular text-slate-300'} fa-heart text-sm"></i></button>`;
    }

    function badge(g) {
      return (g.featured ? `<span class="px-2 py-0.5 rounded-md border text-xs whitespace-nowrap bg-amber-400/15 text-amber-200 border-amber-400/40 mr-1"><i class="fa-solid fa-star mr-1 text-[10px]"></i>${t('featured')}</span>` : '') + `<span class="px-2 py-0.5 rounded-md border text-xs whitespace-nowrap ${BADGE[g.tier]}">${t('badge_' + g.tier)}</span>`;
    }

    // Shared detail panel: shown when a card or row is expanded.
    function details(g) {
      const pct = Math.min(100, Math.round(g.ramMb / 4096 * 100));
      return `
        <div class="flex flex-col gap-4 min-w-0">
          <p class="text-sm text-slate-200 km-tight">${g[lang]}</p>
          <dl class="grid grid-cols-[auto,1fr] gap-x-4 gap-y-2 text-sm">
            <dt class="text-ink-muted">${t('engineLabel')}</dt><dd class="text-slate-200 min-w-0">${g.engine}</dd>
            <dt class="text-ink-muted">${t('memLabel')}</dt>
            <dd class="min-w-0">
              <div class="text-slate-200">${num((g.ramMb / 1024).toFixed(1))} GB <span class="text-ink-muted text-xs">${t('memOf')}</span></div>
              <div class="mt-1 h-1.5 rounded-full bg-ink-bg overflow-hidden max-w-xs"><div class="h-full rounded-full ${g.ramMb > 2500 ? 'bg-amber-400' : 'bg-ink-accent'}" style="width:${pct}%"></div></div>
            </dd>
            <dt class="text-ink-muted">${t('servers')}</dt>
            <dd class="min-w-0 flex flex-col gap-0.5">${g.mirrors.map((u, i) =>
              `<a href="${u}" target="_blank" rel="noopener" class="text-sky-300 hover:underline break-all">${host(u)}</a>`).join('')}</dd>
          </dl>
          <div class="flex flex-wrap gap-2">
            <a href="${g.mirrors[0]}" target="_blank" rel="noopener" class="h-10 px-5 rounded-lg bg-ink-accent text-ink-bg hover:brightness-110 font-semibold text-sm inline-flex items-center gap-2">
              <i class="fa-solid fa-play text-xs"></i>${t('play')}</a>
            ${g.mirrors[1] ? `<a href="${g.mirrors[1]}" target="_blank" rel="noopener" class="h-10 px-4 rounded-lg border border-ink-line hover:border-ink-accent/50 text-sm text-slate-200 inline-flex items-center gap-2">
              <i class="fa-solid fa-server text-xs"></i>${t('altServer')}</a>` : ''}
            ${g.tier === 'rom' ? `<button onclick="openModal('fileModal')" class="h-10 px-4 rounded-lg border border-amber-500/40 text-amber-300 hover:bg-amber-500/10 text-sm inline-flex items-center gap-2">
              <i class="fa-solid fa-file-circle-check text-xs"></i>${t('checkFile')}</button>` : ''}
          </div>
        </div>`;
    }

    function gridCard(g) {
      const open = expandedId === g.id;
      if (open) {
        return `
          <article id="game-${g.id}" class="card col-span-full rounded-2xl bg-ink-panel border border-ink-accent/60 overflow-hidden">
            <div class="grid md:grid-cols-[minmax(0,2fr),minmax(0,3fr)]">
              <div class="relative">
                ${coverHtml(g)}
                ${favButton(g, 'absolute top-2 right-2 bg-black/50 hover:bg-black/70 backdrop-blur')}
              </div>
              <div class="p-5 flex flex-col gap-4 min-w-0">
                <button onclick="toggleExpand(${g.id})" aria-expanded="true" class="flex items-start justify-between gap-3 text-left">
                  <span class="min-w-0">
                    <span class="block text-lg font-bold text-white">${g.title}</span>
                    <span class="flex flex-wrap items-center gap-2 mt-1 text-xs text-ink-muted">${catName(g.cat)} ${badge(g)}</span>
                  </span>
                  <span class="shrink-0 text-ink-muted hover:text-white text-xs inline-flex items-center gap-1.5 mt-1">${t('hideDetails')}<i class="chev fa-solid fa-chevron-down"></i></span>
                </button>
                ${details(g)}
              </div>
            </div>
          </article>`;
      }
      return `
        <article id="game-${g.id}" class="card relative rounded-2xl bg-ink-panel border border-ink-line hover:border-slate-500 overflow-hidden transition">
          <button onclick="toggleExpand(${g.id})" aria-expanded="false" class="block w-full text-left" title="${t('showDetails')}">
            ${coverHtml(g)}
            <span class="flex items-center justify-between gap-2 px-3.5 py-3">
              <span class="min-w-0">
                <span class="block font-semibold text-white truncate">${g.title}</span>
                <span class="block text-xs text-ink-muted truncate">${catName(g.cat)}</span>
              </span>
              <span class="flex items-center gap-2 shrink-0">${badge(g)}<i class="chev fa-solid fa-chevron-down text-xs text-ink-muted"></i></span>
            </span>
          </button>
          ${favButton(g, 'absolute top-2 right-2 bg-black/50 hover:bg-black/70 backdrop-blur')}
        </article>`;
    }

    function listRow(g) {
      const open = expandedId === g.id;
      return `
        <div id="game-${g.id}" class="${open ? 'bg-ink-raise/60' : ''}">
          <div class="flex items-center gap-2 pr-2">
            <button onclick="toggleExpand(${g.id})" aria-expanded="${open}" class="flex-1 min-w-0 flex items-center gap-3 sm:gap-4 p-2.5 text-left hover:bg-ink-raise/50 transition" title="${open ? t('hideDetails') : t('showDetails')}">
              <span class="w-24 sm:w-32 shrink-0">${coverHtml(g, true)}</span>
              <span class="flex-1 min-w-0">
                <span class="block font-semibold text-white truncate">${g.title}</span>
                <span class="block text-xs text-ink-muted truncate">${catName(g.cat)} · ${g.engine}</span>
              </span>
              <span class="hidden sm:block">${badge(g)}</span>
              <i class="chev fa-solid fa-chevron-down text-xs text-ink-muted px-1"></i>
            </button>
            ${favButton(g, 'shrink-0 hover:bg-ink-raise')}
          </div>
          ${open ? `<div class="px-4 pb-5 pt-1 sm:pl-[10.5rem]"><div class="sm:hidden mb-3">${badge(g)}</div>${details(g)}</div>` : ''}
        </div>`;
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderGrid();
      if (expandedId !== null) {
        const el = document.getElementById('game-' + id);
        if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
        const btn = el && el.querySelector('[aria-expanded]');
        if (btn) btn.focus({ preventScroll: true });
      }
    }

    function setTab(next, remember = true) {
      tab = next;
      catFilter = 'all';
      expandedId = null;
      if (remember) {
        try { localStorage.setItem(TAB_KEY, next); } catch (e) {}
        try { history.replaceState(null, '', '#' + next); } catch (e) {}
      }
      ['classic', 'web'].forEach(k => {
        const b = document.getElementById('tab-' + k);
        b.setAttribute('aria-selected', k === next);
        b.tabIndex = k === next ? 0 : -1;
      });
      renderStatusOptions();
      renderCategories();
      renderGrid();
    }

    function setView(v) {
      view = v;
      try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
      ['grid', 'list'].forEach(k => document.getElementById('view-' + k).setAttribute('aria-pressed', k === v));
      renderGrid();
    }

    /* ===================== TELEMETRY ===================== */
    async function initTelemetry() {
      try {
        if ('gpu' in navigator) {
          const adapter = await navigator.gpu.requestAdapter();
          tel.webgpu = adapter ? 'ok' : 'noAdapter';
        } else tel.webgpu = 'no';
      } catch (e) { tel.webgpu = 'noAdapter'; }

      try {
        const gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
        if (gl) {
          const dbg = gl.getExtension('WEBGL_debug_renderer_info');
          const raw = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
          let clean = String(raw).replace(/ANGLE \((.+)\)/, '$1');
          const m = clean.match(/Apple M[0-9A-Za-z ]*/);
          tel.gpu = (m ? m[0] : clean).trim();
        }
      } catch (e) {}

      tel.threads = window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';
      renderTelemetry();
      updateStorage();

      window.addEventListener('gamepadconnected', pollGamepad);
      window.addEventListener('gamepaddisconnected', pollGamepad);
      setInterval(pollGamepad, 1000);
    }

    function pollGamepad() {
      try {
        const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
        tel.pad = pads.length ? pads[0].id.split('(')[0].trim() || 'Gamepad' : null;
      } catch (e) { tel.pad = null; }
      renderTelemetry();
    }

    function renderTelemetry() {
      const set = (id, text, cls) => { const el = document.getElementById(id); el.textContent = text; el.className = el.className.replace(/\btext-(emerald|amber|slate)-\d+\b/g, '') + ' ' + cls; };
      const wg = tel.webgpu;
      set('sys-webgpu', wg === null ? t('val_checking') : wg === 'ok' ? t('val_ready') : wg === 'noAdapter' ? t('val_noAdapter') : t('val_noWebgpu'),
        wg === 'ok' ? 'text-emerald-300' : wg === null ? 'text-slate-400' : 'text-amber-300');
      set('sys-gpu', tel.gpu || t('val_unknown'), 'text-slate-200');
      document.getElementById('sys-gpu').title = tel.gpu || '';
      set('sys-threads', tel.threads === null ? t('val_checking') : tel.threads ? t('val_threadsOn') : t('val_threadsOff'),
        tel.threads ? 'text-emerald-300' : 'text-amber-300');
      set('sys-pad', tel.pad || t('val_noPad'), tel.pad ? 'text-emerald-300' : 'text-slate-400');
      set('sys-storage', tel.storage ? `${num(tel.storage.usedMb)} MB` : t('val_unknown'), 'text-slate-200');
      document.getElementById('sys-dot').className = 'w-2 h-2 rounded-full ' +
        (wg === null ? 'bg-slate-500' : wg === 'ok' ? 'bg-emerald-400' : 'bg-amber-400');
    }

    async function updateStorage() {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          tel.storage = {
            usedMb: ((est.usage || 0) / 1048576).toFixed(1),
            quotaGb: ((est.quota || 0) / 1073741824).toFixed(1)
          };
        }
      } catch (e) { tel.storage = null; }
      document.getElementById('storage-used').textContent = tel.storage
        ? t('storageUsed', { used: num(tel.storage.usedMb) + ' MB', quota: num(tel.storage.quotaGb) + ' GB' })
        : t('val_unknown');
      renderTelemetry();
    }

    async function clearHubData() {
      try {
        if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
        if (window.indexedDB && indexedDB.databases) { (await indexedDB.databases()).forEach(db => db.name && indexedDB.deleteDatabase(db.name)); }
      } catch (e) {}
      document.getElementById('storage-feedback').classList.remove('hidden');
      updateStorage();
    }

    async function copyCmd() {
      const cmd = document.getElementById('mac-cmd').textContent;
      try { await navigator.clipboard.writeText(cmd); }
      catch (e) {
        const ta = document.createElement('textarea'); ta.value = cmd; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
      }
      const label = document.getElementById('copy-label');
      label.textContent = t('copied');
      setTimeout(() => { label.textContent = t('copy'); }, 1800);
    }

    /* ===================== FILE CHECKER ===================== */
    const XISO_OFFSET = 0x10000;
    const XISO_SIG = 'MICROSOFT*XBOX*MEDIA';

    async function handleFile(file) {
      if (!file) return;
      try {
        const bytes = new Uint8Array(await file.slice(0, XISO_OFFSET + XISO_SIG.length).arrayBuffer());
        const hex = Array.from(bytes.slice(0, 8)).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
        const ascii = Array.from(bytes.slice(0, 4)).map(b => (b >= 32 && b <= 126 ? String.fromCharCode(b) : '.')).join('');
        const name = file.name.toLowerCase();
        const xiso = bytes.length >= XISO_OFFSET + XISO_SIG.length &&
          new TextDecoder().decode(bytes.slice(XISO_OFFSET, XISO_OFFSET + XISO_SIG.length)) === XISO_SIG;

        let kind = null, gameId = null;
        if (bytes[0] === 0x4D && bytes[1] === 0x50 && bytes[2] === 0x51 && bytes[3] === 0x1A) { kind = 'mpq'; gameId = 23; }
        else if (xiso) { kind = 'xiso'; gameId = 8; }
        else if (name.endsWith('.xiso') || name.endsWith('.iso')) { kind = 'isoExt'; gameId = 8; }
        else if ((bytes[0] === 0x50 && bytes[1] === 0x4B && bytes[2] === 0x03 && bytes[3] === 0x04) || ['PACK', 'WAD2', 'WAD3'].includes(ascii)) { kind = 'zip'; gameId = 11; }

        lastFileResult = { name: file.name, sizeMb: (file.size / 1048576).toFixed(2), hex, ascii, kind, gameId };
      } catch (err) {
        lastFileResult = { error: err.message };
      }
      renderFileResult();
    }

    function renderFileResult() {
      const box = document.getElementById('file-result');
      const r = lastFileResult;
      if (!r) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      if (r.error) { box.innerHTML = `<div class="text-ink-danger">${r.error}</div>`; return; }
      const g = r.gameId ? GAMES.find(x => x.id === r.gameId) : null;
      box.innerHTML = `
        <div class="flex justify-between gap-3"><span class="text-white font-medium truncate">${r.name}</span><span class="text-ink-muted shrink-0">${num(r.sizeMb)} MB</span></div>
        <div class="text-xs text-ink-muted">${t('fileHeader')}: <code class="font-mono text-slate-300">${r.hex}</code></div>
        ${r.kind
          ? `<div class="${r.kind === 'isoExt' ? 'text-amber-300' : 'text-emerald-300'}"><i class="fa-solid ${r.kind === 'isoExt' ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-1.5"></i>${t('fileOk')}: ${t('kind_' + r.kind)}</div>`
          : `<div class="text-amber-300"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>${t('fileBad')}</div>`}
        ${g ? `<a href="${g.mirrors[0]}" target="_blank" rel="noopener" class="mt-1 h-9 px-4 rounded-lg bg-ink-accent text-ink-bg font-semibold inline-flex items-center">${t('launchGame', { game: g.title })}</a>` : ''}`;
    }

    function sampleFile(name) {
      let bytes;
      if (name === 'Halo.xiso') {
        bytes = new Uint8Array(XISO_OFFSET + XISO_SIG.length);
        bytes.set(new TextEncoder().encode(XISO_SIG), XISO_OFFSET);
      } else {
        bytes = new Uint8Array(64);
        bytes.set(name === 'DIABDAT.MPQ' ? [0x4D, 0x50, 0x51, 0x1A, 0x20, 0, 0, 0] : [0x50, 0x4B, 0x03, 0x04, 0x14, 0, 0, 0]);
      }
      handleFile(new File([bytes], name));
    }

    const dz = document.getElementById('dropzone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('!border-ink-accent'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('!border-ink-accent'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('!border-ink-accent');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    /* ===================== MODALS ===================== */
    function openModal(id) {
      const m = document.getElementById(id);
      m.classList.remove('hidden'); m.classList.add('flex');
      if (id === 'storageModal') { document.getElementById('storage-feedback').classList.add('hidden'); updateStorage(); }
    }
    function closeModal(id) {
      const m = document.getElementById(id);
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); }));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.modal.flex').forEach(m => closeModal(m.id));
    });

    /* ===================== INIT ===================== */
    setView(view);
    setTab(tab, false);
    setLang(lang === 'en' ? 'en' : 'km', false);
    initTelemetry();
  </script>


</html>
